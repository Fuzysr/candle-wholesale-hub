# Include from the nginx http{} block. CDN/WAF remains the outer perimeter.
limit_req_zone $binary_remote_addr zone=candwax_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=candwax_auth:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=candwax_conn:10m;

server_tokens off;
client_max_body_size 10m;
client_body_timeout 10s;
client_header_timeout 10s;
keepalive_timeout 20s;
send_timeout 30s;

# Use only on the API server/location.
# limit_conn candwax_conn 20;
# limit_req zone=candwax_api burst=40 nodelay;
# For /auth/login and password reset use:
# limit_req zone=candwax_auth burst=5 nodelay;
