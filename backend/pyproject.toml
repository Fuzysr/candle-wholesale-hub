[project]
name = "candle-wholesale-backend"
version = "0.1.0"
description = "FastAPI backend for candle wholesale hub"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiomysql>=0.2.0",
    "PyMySQL>=1.1.0",
    "alembic>=1.13.3",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "argon2-cffi>=23.1.0",
    "PyJWT>=2.9.0",
    "cryptography>=44.0.0",
    "python-multipart>=0.0.12",
    "email-validator>=2.2.0",
    # Rate-limiting middleware. Default in-memory storage works for a
    # single-uvicorn-worker deploy; multi-worker / multi-process setups
    # should configure SLOWAPI_STORAGE_URI to point at Redis.
    "slowapi>=0.1.9",
    "redis>=5.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Use a single event loop for the whole session so the module-level
# SQLAlchemy engine + aiomysql pool keeps its connections valid across
# tests. With the default per-function loop, pool pre-ping crashes with
# «Task got Future attached to a different loop» on the second test.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
# FastAPI's dependency injection intentionally calls Depends/File in function
# defaults; Ruff's generic B008 rule does not understand this framework idiom.
ignore = ["E501", "B008"]
